<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173c34">
  <title>Carl & Julia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #173c34;
      --green-dark: #0d2822;
      --gold: #c69a4b;
      --cream: #f6f0e6;
      --sand: #ded2bd;
      --white: #fffdf8;
      --grid-size: 3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(198, 154, 75, 0.10), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(23, 60, 52, 0.08), transparent 32%),
        var(--cream);
      color: var(--green);
      font-family: "Montserrat", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      min-height: 100svh;
      width: 100%;
    }

    .start-screen {
      display: grid;
      place-items: center;
      padding: 28px 20px;
      text-align: center;
    }

    .start-card {
      width: min(520px, 100%);
      padding: clamp(34px, 8vw, 64px) clamp(24px, 7vw, 54px);
      border: 1px solid rgba(198, 154, 75, 0.45);
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.78);
      box-shadow: 0 24px 70px rgba(23, 60, 52, 0.12);
      backdrop-filter: blur(8px);
    }

    .heart {
      color: var(--gold);
      font-size: 30px;
      line-height: 1;
    }

    .eyebrow {
      margin: 18px 0 6px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    .start-title {
      margin-bottom: 14px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(46px, 12vw, 72px);
      font-weight: 600;
      line-height: 0.95;
    }

    .start-copy {
      margin: 0 auto 30px;
      max-width: 340px;
      color: #53645f;
      font-size: 14px;
      line-height: 1.7;
    }

    .primary-button {
      min-width: 210px;
      padding: 16px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 12px 28px rgba(23, 60, 52, 0.22);
      color: var(--white);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      transition: transform 160ms ease, background 160ms ease;
    }

    .primary-button:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
    }

    .game-screen {
      display: none;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      padding: 20px 16px 30px;
    }

    .game-screen.visible {
      display: flex;
    }

    .game-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: min(720px, 94vw);
      margin-bottom: 14px;
    }

    .reset-button {
      justify-self: start;
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .game-mark {
      color: var(--gold);
      font-size: 24px;
    }

    .size-label {
      justify-self: end;
      color: #6d756f;
      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
      font-weight: 600;
    }

    .puzzle-shell {
      position: relative;
      width: min(720px, 94vw);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 5px solid var(--white);
      border-radius: 24px;
      background: var(--sand);
      box-shadow: 0 22px 55px rgba(23, 60, 52, 0.18);
    }

    .puzzle-board {
      position: absolute;
      inset: 0;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(100% / var(--grid-size));
      height: calc(100% / var(--grid-size));
      padding: 0;
      border: 2px solid var(--white);
      background-image: url("CJ-slide.jpg");
      background-repeat: no-repeat;
      background-size: 300% 300%;
      cursor: pointer;
      transition: transform 260ms cubic-bezier(0.22, 0.75, 0.25, 1), filter 180ms ease;
      will-change: transform;
    }

    .tile:hover {
      filter: brightness(1.04);
    }

    .puzzle-board.no-motion .tile {
      transition: none;
    }

    .puzzle-board.locked .tile {
      cursor: default;
      pointer-events: none;
    }

    .empty-marker {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(100% / var(--grid-size));
      height: calc(100% / var(--grid-size));
      border: 2px dashed rgba(198, 154, 75, 0.75);
      pointer-events: none;
      transition: transform 260ms cubic-bezier(0.22, 0.75, 0.25, 1), opacity 200ms ease;
    }

    .puzzle-board.no-motion .empty-marker {
      transition: none;
    }

    .solved-photo {
      position: absolute;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0;
      pointer-events: none;
      transition: opacity 350ms ease;
    }

    .puzzle-shell.solved .solved-photo {
      opacity: 1;
    }

    .instruction {
      margin: 17px 0 0;
      color: #6b756f;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
    }

    .reveal {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      overflow-y: auto;
      background:
        linear-gradient(rgba(8, 28, 23, 0.84), rgba(8, 28, 23, 0.92)),
        url("CJ-slide.jpg") center / cover no-repeat;
      color: var(--white);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transition: opacity 900ms ease;
    }

    .reveal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .reveal-content {
  width: min(560px, 92vw);
  max-width: 100%;
  transform: translateY(16px);
  opacity: 0;
  transition: transform 800ms 350ms ease, opacity 800ms 350ms ease;
    }

    .reveal.visible .reveal-content {
      transform: translateY(0);
      opacity: 1;
    }

   .reveal-names {
  margin: 15px 0 8px;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(34px, 9vw, 58px);
  font-weight: 600;
  line-height: 1;
    }

    .reveal-news {
      margin-bottom: 20px;
      color: #e6bf76;
      font-size: clamp(13px, 3.3vw, 18px);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(300px, 75%);
      margin: 0 auto 18px;
      color: var(--gold);
    }

    .divider::before,
    .divider::after {
      flex: 1;
      height: 1px;
      background: rgba(230, 191, 118, 0.55);
      content: "";
    }

    .date {
  margin-bottom: 28px;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(20px, 5.8vw, 38px);
  font-weight: 600;
  letter-spacing: 0;
  line-height: 1.1;
  white-space: nowrap;
    }

    .save-label {
      margin: 8px 0 24px;
      color: #e6bf76;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .location-line {
      margin-bottom: 8px;
      color: var(--white);
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 600;
    }

    .more-info {
      margin-bottom: 18px;
      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
      font-style: italic;
      opacity: 0.88;
    }

    .play-again {
      display: block;
      margin: 18px auto 0;
      padding: 8px 12px;
      border: 0;
      background: transparent;
      color: rgba(255, 253, 248, 0.82);
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.10em;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-transform: uppercase;
    }

    .confetti-layer {
      position: fixed;
      z-index: 30;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 16px;
      opacity: 0.95;
      animation: confetti-fall var(--duration) linear forwards;
    }

    @keyframes confetti-fall {
      to {
        transform: translate3d(var(--drift), calc(100svh + 40px), 0) rotate(var(--spin));
      }
    }

    @media (max-height: 760px) {
      .puzzle-shell {
        width: min(590px, 78vh, 94vw);
      }

      .reveal {
        padding-block: 18px;
      }

      .reveal-names {
        font-size: clamp(44px, 10vh, 68px);
      }

      .date {
        font-size: clamp(38px, 8vh, 58px);
      }

      .more-info {
        margin-bottom: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="screen start-screen" id="startScreen">
      <div class="start-card">
        <div class="heart" aria-hidden="true">♥</div>
        <p class="eyebrow">Ett litet pussel från</p>
        <h1 class="start-title">Carl & Julia</h1>
        <p class="start-copy">Lägg bilden rätt för att låsa upp vår överraskning.</p>
        <button class="primary-button" id="startButton" type="button">Starta</button>
      </div>
    </section>

    <section class="screen game-screen" id="gameScreen" aria-label="Bildpussel">
      <header class="game-header">
        <button class="reset-button" id="resetButton" type="button">↻ Börja om</button>
        <span class="game-mark" aria-hidden="true">♥</span>
        <span class="size-label">3 × 3</span>
      </header>

      <div class="puzzle-shell" id="puzzleShell">
        <div class="puzzle-board" id="puzzleBoard" aria-label="Flytta brickorna tills bilden är hel">
          <div class="empty-marker" id="emptyMarker"></div>
        </div>
        <img class="solved-photo" src="CJ-slide.jpg" alt="Carl och Julia" draggable="false">
      </div>

      <p class="instruction">Klicka på en ruta bredvid tomrummet</p>
    </section>

    <section class="reveal" id="reveal" aria-hidden="true">
      <div class="reveal-content">
        <h2 class="reveal-names">Välkommen på bröllop</h2>
        <div class="heart" aria-hidden="true">♥</div>
        <p class="date">3 juli 2027 | Ljusdal</p>
        <p class="more-info">Mer information kommer</p>
        <button class="play-again" id="playAgainButton" type="button">↻ Spela igen</button>
      </div>
    </section>

    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  </main>

  <script>
    const GRID_SIZE = 3;
    const SHUFFLE_MOVES = 6;
    const IMAGE_URL = "CJ-slide.jpg";

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const gameHeader = document.querySelector(".game-header");
    const puzzleShell = document.getElementById("puzzleShell");
    const puzzleBoard = document.getElementById("puzzleBoard");
    const emptyMarker = document.getElementById("emptyMarker");
    const reveal = document.getElementById("reveal");
    const confettiLayer = document.getElementById("confettiLayer");

    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const playAgainButton = document.getElementById("playAgainButton");

    const solvedState = Array.from(
      { length: GRID_SIZE * GRID_SIZE },
      (_, index) => index === GRID_SIZE * GRID_SIZE - 1 ? null : index
    );

    let boardState = [...solvedState];
    let tileElements = new Map();
    let locked = false;
    let revealTimers = [];

    function rowOf(position) {
      return Math.floor(position / GRID_SIZE);
    }

    function columnOf(position) {
      return position % GRID_SIZE;
    }

    function positionTransform(position) {
      return `translate(${columnOf(position) * 100}%, ${rowOf(position) * 100}%)`;
    }

    function adjacentPositions(position) {
      const row = rowOf(position);
      const column = columnOf(position);
      const positions = [];

      if (row > 0) positions.push(position - GRID_SIZE);
      if (row < GRID_SIZE - 1) positions.push(position + GRID_SIZE);
      if (column > 0) positions.push(position - 1);
      if (column < GRID_SIZE - 1) positions.push(position + 1);

      return positions;
    }

    function buildTiles() {
      tileElements.forEach((element) => element.remove());
      tileElements = new Map();

      for (let tileNumber = 0; tileNumber < GRID_SIZE * GRID_SIZE - 1; tileNumber += 1) {
        const tile = document.createElement("button");
        const correctRow = rowOf(tileNumber);
        const correctColumn = columnOf(tileNumber);
        const backgroundX = correctColumn * 100 / (GRID_SIZE - 1);
        const backgroundY = correctRow * 100 / (GRID_SIZE - 1);

        tile.type = "button";
        tile.className = "tile";
        tile.setAttribute("aria-label", `Pusselbit ${tileNumber + 1}`);
        tile.style.backgroundImage = `url("${IMAGE_URL}")`;
        tile.style.backgroundPosition = `${backgroundX}% ${backgroundY}%`;
        tile.addEventListener("click", () => moveTile(tileNumber));

        puzzleBoard.appendChild(tile);
        tileElements.set(tileNumber, tile);
      }
    }

    function renderBoard(withMotion = true) {
      puzzleBoard.classList.toggle("no-motion", !withMotion);

      boardState.forEach((tileNumber, position) => {
        if (tileNumber !== null) {
          tileElements.get(tileNumber).style.transform = positionTransform(position);
        }
      });

      const emptyPosition = boardState.indexOf(null);
      emptyMarker.style.transform = positionTransform(emptyPosition);

      if (!withMotion) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => puzzleBoard.classList.remove("no-motion"));
        });
      }
    }

    function shuffleBoard() {
      boardState = [...solvedState];
      let emptyPosition = boardState.indexOf(null);
      let previousEmptyPosition = -1;

      for (let move = 0; move < SHUFFLE_MOVES; move += 1) {
        let choices = adjacentPositions(emptyPosition)
          .filter((position) => position !== previousEmptyPosition);

        if (choices.length === 0) {
          choices = adjacentPositions(emptyPosition);
        }

        const chosenPosition = choices[Math.floor(Math.random() * choices.length)];
        boardState[emptyPosition] = boardState[chosenPosition];
        boardState[chosenPosition] = null;
        previousEmptyPosition = emptyPosition;
        emptyPosition = chosenPosition;
      }

      if (isSolved()) {
        const fallbackMove = adjacentPositions(boardState.indexOf(null))[0];
        const empty = boardState.indexOf(null);
        boardState[empty] = boardState[fallbackMove];
        boardState[fallbackMove] = null;
      }
    }

    function moveTile(tileNumber) {
      if (locked) return;

      const tilePosition = boardState.indexOf(tileNumber);
      const emptyPosition = boardState.indexOf(null);

      if (!adjacentPositions(emptyPosition).includes(tilePosition)) return;

      boardState[emptyPosition] = tileNumber;
      boardState[tilePosition] = null;
      renderBoard(true);

      if (isSolved()) {
        locked = true;
        puzzleBoard.classList.add("locked");
        window.setTimeout(showCompletedImage, 300);
      }
    }

    function isSolved() {
      return boardState.every((tileNumber, position) => tileNumber === solvedState[position]);
    }

    function clearRevealTimers() {
      revealTimers.forEach((timer) => window.clearTimeout(timer));
      revealTimers = [];
    }

    function showCompletedImage() {
      puzzleShell.classList.add("solved");

      revealTimers.push(window.setTimeout(createConfetti, 500));
      revealTimers.push(window.setTimeout(showReveal, 1900));
    }

    function showReveal() {
      reveal.classList.add("visible");
      reveal.setAttribute("aria-hidden", "false");
    }

    function createConfetti() {
      confettiLayer.replaceChildren();
      const colors = ["#c69a4b", "#f4d99f", "#fffdf8", "#173c34"];

      for (let index = 0; index < 90; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[index % colors.length];
        piece.style.borderRadius = Math.random() > 0.55 ? "50%" : "2px";
        piece.style.setProperty("--duration", `${2.4 + Math.random() * 2.2}s`);
        piece.style.setProperty("--drift", `${-90 + Math.random() * 180}px`);
        piece.style.setProperty("--spin", `${360 + Math.random() * 900}deg`);
        piece.style.animationDelay = `${Math.random() * 0.65}s`;
        confettiLayer.appendChild(piece);
      }

      window.setTimeout(() => confettiLayer.replaceChildren(), 5400);
    }

    function startGame() {
      clearRevealTimers();
      reveal.classList.remove("visible");
      reveal.setAttribute("aria-hidden", "true");
      confettiLayer.replaceChildren();
      puzzleShell.classList.remove("solved");
      puzzleBoard.classList.remove("locked");
      locked = false;

      shuffleBoard();
      renderBoard(false);

      startScreen.style.display = "none";
      gameScreen.classList.add("visible");
    }

    function restartPuzzle() {
      clearRevealTimers();
      reveal.classList.remove("visible");
      reveal.setAttribute("aria-hidden", "true");
      confettiLayer.replaceChildren();
      puzzleShell.classList.remove("solved");
      puzzleBoard.classList.remove("locked");
      locked = false;

      shuffleBoard();
      renderBoard(false);
    }

    buildTiles();
    renderBoard(false);

    const sourceImage = new Image();

    function fitPuzzleToImage() {
      if (!sourceImage.naturalWidth || !sourceImage.naturalHeight) return;

      const imageRatio = sourceImage.naturalWidth / sourceImage.naturalHeight;
      const maximumWidth = Math.min(720, window.innerWidth * 0.94);
      const maximumHeight = Math.max(340, window.innerHeight - 150);
      const fittedWidth = Math.min(maximumWidth, maximumHeight * imageRatio);

      puzzleShell.style.width = `${fittedWidth}px`;
      puzzleShell.style.aspectRatio = `${sourceImage.naturalWidth} / ${sourceImage.naturalHeight}`;
      gameHeader.style.width = `${fittedWidth}px`;
      renderBoard(false);
    }

    sourceImage.addEventListener("load", fitPuzzleToImage);
    sourceImage.src = IMAGE_URL;

    startButton.addEventListener("click", startGame);
    resetButton.addEventListener("click", restartPuzzle);
    playAgainButton.addEventListener("click", restartPuzzle);
    window.addEventListener("resize", fitPuzzleToImage);
  </script>
</body>
</html>
